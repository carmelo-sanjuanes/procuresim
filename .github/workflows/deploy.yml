name: Verificar y publicar ProcureSim en GitHub Pages

# Acciones fijadas por SHA de commit (no por etiqueta) para que nadie pueda
# cambiar el código que corre aquí moviendo una etiqueta. Dependabot las actualiza.

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

# Por defecto, ningún permiso. Cada trabajo pide solo lo que necesita.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas, auditoría de dependencias y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias exactas del lockfile (sin scripts de instalación)
        run: npm ci --ignore-scripts

      - name: Auditar dependencias (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Comprobar que la política de seguridad quedó en el HTML
        run: grep -q 'http-equiv="Content-Security-Policy"' dist/index.html

      - name: Comprobar que no hay mapas de código fuente publicados
        run: test -z "$(find dist -name '*.map' -print -quit)"

      - name: Preparar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Subir el sitio compilado
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  publicar:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
